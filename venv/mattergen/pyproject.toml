# mattergen's own requirements cannot hold on current GPUs (they pin an old torch
# build, among others); its real dependencies are pinned above, so it gets
# none of its own -- the equivalent of the verified `pip install --no-deps`.
[[tool.uv.dependency-metadata]]
name = "mattergen"
version = "1.0.3"
requires-dist = []

# mattersim's own requirements cannot hold on current GPUs (they pin an old torch
# build, among others); its real dependencies are pinned above, so it gets
# none of its own -- the equivalent of the verified `pip install --no-deps`.
[[tool.uv.dependency-metadata]]
name = "mattersim"
version = "1.2.0"
requires-dist = []

[tool.uv.extra-build-dependencies]
# The aarch64 source builds compile against the environment's own torch.
torch-scatter = [{ requirement = "torch", match-runtime = true }, "ninja"]
torch-sparse = [{ requirement = "torch", match-runtime = true }, "ninja"]
torch-cluster = [{ requirement = "torch", match-runtime = true }, "ninja"]

# Static metadata for those source builds, which match-runtime requires.
[[tool.uv.dependency-metadata]]
name = "torch-scatter"
version = "2.1.2"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "torch-sparse"
version = "0.6.18"
requires-dist = ["scipy"]

[[tool.uv.dependency-metadata]]
name = "torch-cluster"
version = "1.6.3"
requires-dist = ["scipy"]

[tool.atomisticskills]
# Hosts run this stack natively here only; elsewhere venv/run uses the image.
native-arches = ["x86_64"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
# PyG's compiled extensions, built for this torch minor version and CUDA build.
name = "pyg-cu126"
url = "https://data.pyg.org/whl/torch-2.9.0+cu126.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "pyg-cu130"
url = "https://data.pyg.org/whl/torch-2.9.0+cu130.html"
format = "flat"
explicit = true

[tool.uv.sources]
atomisticskills = { path = "../..", editable = true }
torch = [
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu130", extra = "cu130" },
]
torch-scatter = [
  { index = "pyg-cu126", extra = "cu126", marker = "platform_machine == 'x86_64'" },
  { index = "pyg-cu130", extra = "cu130", marker = "platform_machine == 'x86_64'" },
]
torch-sparse = [
  { index = "pyg-cu126", extra = "cu126", marker = "platform_machine == 'x86_64'" },
  { index = "pyg-cu130", extra = "cu130", marker = "platform_machine == 'x86_64'" },
]
torch-cluster = [
  { index = "pyg-cu126", extra = "cu126", marker = "platform_machine == 'x86_64'" },
  { index = "pyg-cu130", extra = "cu130", marker = "platform_machine == 'x86_64'" },
]
