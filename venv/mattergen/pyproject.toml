[project.optional-dependencies]
# Exactly one torch build per environment, chosen by venv/run from the NVIDIA
# driver: cu130 (CUDA 13; driver >= 580) when the driver allows, else cu126
# (CUDA 12.6; drivers >= 525). ATOMISTIC_TORCH_CUDA=cu126|cu130 overrides it.
cu126 = ["torch==2.9.1", "torchvision==0.24.1", "torch-scatter==2.1.2", "torch-sparse==0.6.18", "torch-cluster==1.6.3"]
cu130 = ["torch==2.9.1", "torchvision==0.24.1", "torch-scatter==2.1.2", "torch-sparse==0.6.18", "torch-cluster==1.6.3"]

[tool.uv]
package = false
conflicts = [[{ extra = "cu126" }, { extra = "cu130" }]]
# Locked for x86_64 and aarch64. PyG publishes its compiled extensions
# (torch-scatter, ...) for x86_64 only; on aarch64 they are built from source,
# which needs the CUDA toolkit and FORCE_CUDA=1 (without it the build silently
# lacks the CUDA kernels). The `generative` image does that build, so aarch64
# hosts run this stack from the image ([tool.atomisticskills] below).
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
# Every package has a wheel on x86_64; aarch64 builds the three PyG extensions.
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# The verified environment was installed as a closed set (pip --no-deps) that
# deliberately violates some upstream pins, so every pin is also an override.
# torch and torchvision are not: an override would drop their per-extra index.
override-dependencies = [
