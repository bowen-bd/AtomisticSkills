[project]
name = "atomisticskills-venv-scd"
version = "0.1.0"
description = "SelfConditionedDenoisingAtoms training and transfer (ml-property-predict-scd)"
requires-python = "==3.12.*"
# The runtime of SelfConditionedDenoisingAtoms (its requirements.txt). The
# repository itself is not a package: the skill clones it and runs train.py
# from that checkout.
dependencies = [
  # The repository itself, so `src` is importable from any directory.
  "atomisticskills",
  # The torch build comes from the cu126 / cu130 extras below; this keeps the
  # version the same without one.
  "torch==2.10.0",
  "pytorch-lightning>=2.0.0",
  "lightning-utilities",
  "torch-geometric>=2.4.0",
  "numpy>=1.20.0",
  "scipy>=1.7.0",
  "scikit-learn>=1.0.0",
  "pandas>=1.3.0",
  "ase>=3.22.0",
  "pymatgen>=2023.0.0",
  "rdkit>=2020.0.0",
  "datasets>=2.0.0",
  "matplotlib>=3.4.0",
  "tqdm>=4.62.0",
  "pyyaml>=5.4.0",
  "wandb>=0.12.0",
  "huggingface-hub>=0.10.0",
  # For the optional TorchMD graph kernel (`python setup.py build_ext`).
  "setuptools",
]

[project.optional-dependencies]
# Exactly one torch build per environment, chosen by venv/run from the NVIDIA
# driver: cu130 (CUDA 13; driver >= 580) when the driver allows, else cu126
# (CUDA 12.6; drivers >= 525). ATOMISTIC_TORCH_CUDA=cu126|cu130 overrides it.
# The upstream code imports PyG's compiled extensions directly; PyG builds them
# per torch minor version, and 2.10 is the newest it covers for both CUDA lines.
cu126 = ["torch==2.10.0", "torch-scatter==2.1.2", "torch-sparse==0.6.18", "torch-cluster==1.6.3"]
cu130 = ["torch==2.10.0", "torch-scatter==2.1.2", "torch-sparse==0.6.18", "torch-cluster==1.6.3"]

[tool.uv]
package = false
conflicts = [[{ extra = "cu126" }, { extra = "cu130" }]]
# x86_64 only: PyG publishes its compiled extensions for x86_64.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
# PyG's compiled extensions, built for this torch minor version and CUDA build.
name = "pyg-cu126"
url = "https://data.pyg.org/whl/torch-2.10.0+cu126.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "pyg-cu130"
url = "https://data.pyg.org/whl/torch-2.10.0+cu130.html"
format = "flat"
explicit = true

[tool.uv.sources]
atomisticskills = { path = "../..", editable = true }
torch = [
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu130", extra = "cu130" },
]
torch-scatter = [
  { index = "pyg-cu126", extra = "cu126" },
  { index = "pyg-cu130", extra = "cu130" },
]
torch-sparse = [
  { index = "pyg-cu126", extra = "cu126" },
  { index = "pyg-cu130", extra = "cu130" },
]
torch-cluster = [
  { index = "pyg-cu126", extra = "cu126" },
  { index = "pyg-cu130", extra = "cu130" },
]
