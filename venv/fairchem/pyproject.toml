[project]
name = "atomisticskills-venv-fairchem"
version = "0.1.0"
description = "FairChem stack. Separate from mlip because the e3nn requirements conflict."
requires-python = ">=3.12,<3.13"
dependencies = [
  # The repository itself, so `src` is importable from any directory.
  "atomisticskills",
  "feedparser",
  "mcp<2",
  "ase",
  "atomate2",
  "beautifulsoup4",
  "biopython",
  "cvxpy",
  "dara-xrd",
  "datasets",
  "dimorphite-dl",
  "fipy",
  "gemmi",
  "h5py>=3.12",
  "huggingface-hub",
  "ijson",
  "imageio",
  "jobflow",
  "jobflow-remote",
  # Static plotly export. kaleido >= 1 drives an installed Chrome/Chromium
  # (plotly 7 no longer accepts the bundled-Chromium 0.x releases); on x86_64
  # it can fetch one itself with `plotly_get_chrome`.
  "kaleido",
  "lobsterpy",
  "matcalc",
  "matplotlib",
  "mdanalysis",
  "meeko",
  "mp-api",
  "mpcontribs-client",
  "nmrsim",
  "nmrglue",
  "numpy>=2",
  "openbabel-wheel",
  "opencv-python-headless",
  "optimade[http-client]",
  "pandas",
  "pillow",
  "polytope",
  "posebusters",
  "prolif",
  "pymatgen",
  "pymatgen-analysis-defects",
  "pymatgen-analysis-diffusion",
  "pymupdf",
  "python-pptx",
  "pycalphad",
  "pyyaml",
  "reaction-network",
  "rdkit",
  "requests",
  "rxn4chemistry",
  "scikit-learn",
  "scipy",
  "scine-utilities ; platform_machine == 'x86_64'",
  "scine-readuct ; platform_machine == 'x86_64'",
  "smol",
  "sympy",
  "tinydb",
  "tqdm",
  "xarray",
  "torch",
  # Lower bounds keep the science packages on their latest releases: left
  # unbounded, the resolver would rather keep torch/numpy newest and silently
  # fall back to old releases of these. Raise them as new versions come out.
  "fairchem-core>=2.23",
  # GPU-batched relaxation and MD (ml-mlip-nvalchemi).
  "nvalchemi-toolkit>=0.2",
]

[project.optional-dependencies]
# See venv/cpu/pyproject.toml: OpenMM wheels need glibc 2.34 and PyMOL is
# x86_64-only, so neither may sit in the base set.
openmm = ["openmm", "pdbfixer", "parmed"]
pymol = ["pymol-open-source==3.2.0a0 ; platform_machine == 'x86_64'"]
# AutoDock Vina publishes no aarch64 wheel for Python 3.12; there it builds
# from source and needs the Boost headers (apt: libboost-all-dev). As an
# extra, a host without Boost loses docking only, not the whole project.
docking = ["vina"]
# VOID (chem-docking-void) comes from git; as an extra, only that skill needs a
# git executable on the host.
void = ["VOID"]
# AMSET runs inside the transport workflow's worker, not where the flow is
# built (atomate2 imports it only when the job executes). Its BoltzTraP2
# dependency compiles from source and clones GoogleTest with git at build time,
# so it stays out of the base set; install it to run AMSET jobs locally.
transport = ["amset"]
# Exactly one torch build per environment, chosen by venv/run from the NVIDIA
# driver: cu130 (CUDA 13; driver >= 580; GB10's sm_121 needs it) when the driver
# allows, else cu126 (CUDA 12.6; drivers >= 525, still common on clusters).
# ATOMISTIC_TORCH_CUDA=cu126|cu130 overrides the choice.
cu126 = ["torch"]
cu130 = ["torch"]

[dependency-groups]
dev = ["pytest", "pytest-timeout"]

[tool.uv]
package = false
conflicts = [[{ extra = "cu126" }, { extra = "cu130" }]]
# Both architectures are supported: amd64 for ordinary clusters and
# workstations, arm64 for GB10-class hardware. Anything that genuinely has no
# wheel for one of them carries a platform_machine marker above, rather than
# being dropped for everyone.
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
# Fail the lock, rather than the install, when a package has no wheel for one
# of the two architectures.
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[[tool.uv.index]]
# CUDA 13 builds of torch (the cu130 extra). PyTorch's own index rather than
# PyPI: PyPI's aarch64 torch wheels are not always CUDA builds (2.10.0's was
# CPU-only).
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
# CUDA 12.6 builds of torch (the cu126 extra), for drivers older than 580.
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.extra-build-dependencies]
# conda-forge publishes boltztrap2 for linux-64 only, so it is built from
# source here and needs cmake present at build time.
boltztrap2 = ["cmake>=3.24"]

[tool.uv.sources]
atomisticskills = { path = "../..", editable = true }
# The Voronoi docking library used by chem-docking-void. Not on PyPI -- the
# package published there under the name "void" is an unrelated utility.
VOID = { git = "https://github.com/learningmatter-mit/VOID.git" }
torch = [
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu130", extra = "cu130" },
]
