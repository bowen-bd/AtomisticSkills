# PyG's compiled extensions for torch 2.2 (x86_64 wheels). aarch64 has none, so
# there they build from source against the same torch.
find-links = ["https://data.pyg.org/whl/torch-2.2.0+cu121.html"]

[tool.uv.extra-build-dependencies]
torch-scatter = [{ requirement = "torch", match-runtime = true }]
torch-sparse = [{ requirement = "torch", match-runtime = true }]
torch-cluster = [{ requirement = "torch", match-runtime = true }]
torch-spline-conv = [{ requirement = "torch", match-runtime = true }]


# Static metadata for the PyG extensions, which uv needs to build them against
# the runtime torch on aarch64 (match-runtime) without building them to lock.
[[tool.uv.dependency-metadata]]
name = "torch-scatter"
version = "2.1.2"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "torch-sparse"
version = "0.6.18"
requires-dist = ["scipy"]

[[tool.uv.dependency-metadata]]
name = "torch-cluster"
version = "1.6.3"
requires-dist = ["scipy"]

[[tool.uv.dependency-metadata]]
name = "torch-spline-conv"
version = "1.2.2"
requires-dist = []

[[tool.uv.index]]
# torch 2.2.1 has no CUDA 12.6/13 builds: CUDA 12.1 on x86_64 (driver >= 525);
# aarch64 takes PyPI's CPU build, as the verified environment did.
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
atomisticskills = { path = "../..", editable = true }
torch = [{ index = "pytorch-cu121", marker = "platform_machine == 'x86_64'" }]
torchvision = [{ index = "pytorch-cu121", marker = "platform_machine == 'x86_64'" }]
