[project]
name = "atomisticskills-venv-reactot"
version = "0.1.0"
description = "React-OT transition-state generation (chem-react-ot)"
requires-python = "==3.10.*"
# Reproduces the environment React-OT was verified in: every package pinned to
# that version. React-OT itself is not a dependency: its upstream repository
# needs patches, so skills/chem-react-ot/scripts/setup_react_ot.py clones and
# patches it, and generate_ts.py imports it from there.
dependencies = [
  # The repository itself, so `src` is importable from any directory.
  "atomisticskills",
