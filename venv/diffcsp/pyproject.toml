[project.optional-dependencies]
# Exactly one torch build per environment, chosen by venv/run from the NVIDIA
# driver: cu130 (CUDA 13; driver >= 580) when the driver allows, else cu126
# (CUDA 12.6; drivers >= 525). ATOMISTIC_TORCH_CUDA=cu126|cu130 overrides it.
cu126 = ["torch==2.10.0", "torchvision==0.25.0", "torch-scatter==2.1.2", "torch-sparse==0.6.18", "torch-cluster==1.6.3"]
cu130 = ["torch==2.10.0", "torchvision==0.25.0", "torch-scatter==2.1.2", "torch-sparse==0.6.18", "torch-cluster==1.6.3"]

[tool.uv]
package = false
conflicts = [[{ extra = "cu126" }, { extra = "cu130" }]]
# x86_64 only: PyG publishes its compiled extensions (torch-scatter, ...) for
# x86_64; on aarch64 venv/run uses the `generative` image, whose extensions are
# compiled with CUDA at image build time.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# The verified environment was installed as a closed set (pip --no-deps) that
# deliberately violates some upstream pins, so every pin is also an override.
# torch and torchvision are not: an override would drop their per-extra index.
override-dependencies = [
  "aiohappyeyeballs==2.6.1",
