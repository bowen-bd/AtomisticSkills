[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
# PyG's compiled extensions, built for this torch minor version and CUDA build.
name = "pyg-cu126"
url = "https://data.pyg.org/whl/torch-2.10.0+cu126.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "pyg-cu130"
url = "https://data.pyg.org/whl/torch-2.10.0+cu130.html"
format = "flat"
explicit = true

[tool.uv.sources]
atomisticskills = { path = "../..", editable = true }
torch = [
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu130", extra = "cu130" },
]
torch-scatter = [
  { index = "pyg-cu126", extra = "cu126" },
  { index = "pyg-cu130", extra = "cu130" },
]
torch-sparse = [
  { index = "pyg-cu126", extra = "cu126" },
  { index = "pyg-cu130", extra = "cu130" },
]
torch-cluster = [
  { index = "pyg-cu126", extra = "cu126" },
  { index = "pyg-cu130", extra = "cu130" },
]
