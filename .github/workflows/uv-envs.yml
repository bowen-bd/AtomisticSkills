name: uv environments

on:
  # Branches are tested through pull_request; avoid duplicate push + PR runs.
  # docs/ holds no code, commands or SKILL.md files; everything else can
  # change what installs or runs.
  push:
    branches: ["main"]
    tags: ["v*"]
    paths-ignore: ["docs/**"]
  pull_request:
    paths-ignore: ["docs/**"]
  workflow_dispatch:

concurrency:
  group: uv-envs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "venv/**/uv.lock"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render checks
        run: |
          python docker/render.py servers --check
          python docker/render.py plugin-mcp --check

      - name: Sync version check
        run: python tools/sync_version.py --check

      - name: Platforms lock check
        run: venv/run cpu python tools/lock_platforms.py --check

      - name: Skill migrations check
        run: python tools/migrate_skill_commands.py --check

      - name: Run CPU test suites
        run: venv/run cpu python -m pytest tests/test_launcher.py tests/test_skill_runtime.py tests/test_uv_projects.py tests/test_images_and_manifests.py tests/test_tool_cli.py -q

  core-envs:
    name: envs (${{ matrix.runner }}, ${{ matrix.venv }}, ${{ matrix.torch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04]
        venv: [cpu, mlip, fairchem]
        torch: [cu130]
    env:
      ATOMISTIC_TORCH_CUDA: ${{ matrix.torch }}
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "venv/${{ matrix.venv }}/uv.lock"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup environment
        run: venv/run --setup ${{ matrix.venv }}

      - name: Doctor check
        run: venv/run --doctor

      - name: Check skill commands
        run: python tools/check_skill_commands.py --venv ${{ matrix.venv }} --jobs 2

      - name: Server tests
        # The MCP servers' unit tests, in their environment. fairchem's need the
        # gated UMA model (HF_TOKEN), and the research stacks their upstream
        # checkouts, so those run on the test machines instead.
        run: |
          # cpu runs with its openmm extra, for the ligand parameterization test.
          case "${{ matrix.venv }}" in
            cpu)  env=cpu+openmm; dirs="tests/base tests/atomate2 tests/drugdisc tests/smol tests/orca" ;;
            mlip) env=mlip; dirs="tests/mace tests/matgl" ;;
            *)    echo "No server tests in CI for ${{ matrix.venv }}"; exit 0 ;;
          esac
          venv/run $env python -m pytest $dirs -q -p no:cacheprovider -o log_cli=false

      - name: MCP server smoke test
        run: |
          SERVERS="$(awk -F'\t' -v v="${{ matrix.venv }}" '$2 == v { printf "%s ", $1 }' venv/servers.tsv)"
          if [ -z "$SERVERS" ]; then echo "No MCP servers run from ${{ matrix.venv }}"; exit 0; fi
          echo "Smoke testing servers: $SERVERS"
          venv/run cpu python tools/mcp_smoke.py $SERVERS

  extended-envs:
    name: extended envs (${{ matrix.runner }}, ${{ matrix.venv }}, ${{ matrix.torch }})
    # Run the heavy multi-arch (ARM), alternative CUDA (cu126), and research stack matrix
    # on pushes to main, tags, workflow_dispatch, or PRs with 'full-ci' label.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Alternate CUDA 12.6 build on x86
          - { runner: ubuntu-24.04, venv: mlip, torch: cu126 }
          - { runner: ubuntu-24.04, venv: fairchem, torch: cu126 }
          # ARM runner builds
          - { runner: ubuntu-24.04-arm, venv: cpu, torch: cu130 }
          - { runner: ubuntu-24.04-arm, venv: mlip, torch: cu130 }
          - { runner: ubuntu-24.04-arm, venv: fairchem, torch: cu130 }
          - { runner: ubuntu-24.04-arm, venv: mlip, torch: cu126 }
          - { runner: ubuntu-24.04-arm, venv: fairchem, torch: cu126 }
          - { runner: ubuntu-24.04-arm, venv: reactot, torch: cu130 }
          # Research stacks, pinned to their verified environments. The
          # generative ones are x86_64-only (aarch64 uses the generative image).
          - { runner: ubuntu-24.04, venv: mattergen, torch: cu130 }
          - { runner: ubuntu-24.04, venv: mattergen, torch: cu126 }
          - { runner: ubuntu-24.04, venv: adit, torch: cu130 }
          - { runner: ubuntu-24.04, venv: adit, torch: cu126 }
          - { runner: ubuntu-24.04, venv: diffcsp, torch: cu130 }
          - { runner: ubuntu-24.04, venv: diffcsp, torch: cu126 }
          - { runner: ubuntu-24.04, venv: reactot, torch: cu130 }
          - { runner: ubuntu-24.04, venv: msms, torch: cu130 }
          - { runner: ubuntu-24.04, venv: scd, torch: cu130 }
          - { runner: ubuntu-24.04, venv: scd, torch: cu126 }
    env:
      ATOMISTIC_TORCH_CUDA: ${{ matrix.torch }}
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "venv/${{ matrix.venv }}/uv.lock"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup environment
        run: venv/run --setup ${{ matrix.venv }}

      - name: Doctor check
        run: venv/run --doctor

      - name: Check skill commands
        run: python tools/check_skill_commands.py --venv ${{ matrix.venv }} --jobs 2

      - name: Server tests
        # The MCP servers' unit tests, in their environment. fairchem's need the
        # gated UMA model (HF_TOKEN), and the research stacks their upstream
        # checkouts, so those run on the test machines instead.
        run: |
          # cpu runs with its openmm extra, for the ligand parameterization test.
          case "${{ matrix.venv }}" in
            cpu)  env=cpu+openmm; dirs="tests/base tests/atomate2 tests/drugdisc tests/smol tests/orca" ;;
            mlip) env=mlip; dirs="tests/mace tests/matgl" ;;
            *)    echo "No server tests in CI for ${{ matrix.venv }}"; exit 0 ;;
          esac
          venv/run $env python -m pytest $dirs -q -p no:cacheprovider -o log_cli=false

      - name: MCP server smoke test
        run: |
          SERVERS="$(awk -F'\t' -v v="${{ matrix.venv }}" '$2 == v { printf "%s ", $1 }' venv/servers.tsv)"
          if [ -z "$SERVERS" ]; then echo "No MCP servers run from ${{ matrix.venv }}"; exit 0; fi
          echo "Smoke testing servers: $SERVERS"
          venv/run cpu python tools/mcp_smoke.py $SERVERS

  rhel8:
    runs-on: ubuntu-24.04
    container:
      image: rockylinux:8
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y curl gcc gcc-c++ make git

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup CPU environment
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          venv/run --setup cpu

      - name: Doctor check
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          venv/run --doctor

      - name: Run CLI tests
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          venv/run cpu python -m pytest tests/test_tool_cli.py
