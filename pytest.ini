# Pytest Configuration for Multi-Environment Testing
# The MCP servers run in different uv projects (venv/<name>). Markers select
# the tests of one server; tests/conftest.py skips them in other environments.
# Run a server's tests in its environment, e.g.:
#   venv/run mlip python -m pytest tests/mace tests/matgl

[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers for environment-specific tests
markers =
    base: base server and shared utilities (cpu; also mlip, fairchem)
    atomate2: atomate2 server (cpu; also mlip, fairchem)
    drugdisc: drugdisc server (cpu; also mlip, fairchem)
    smol: smol server (cpu; also mlip, fairchem)
    orca: ORCA DFT via SCINE (cpu, x86_64)
    mace: MACE server (mlip)
    matgl: MatGL server (mlip)
    fairchem: FairChem server (fairchem)
    adit: ADiT server (adit)
    diffcsp: DiffCSP++ server (diffcsp)
    mattergen: MatterGen server (mattergen)
    integration: Full workflow integration tests (slow, may require multiple envs)

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Output options
addopts =
    -v
    --strict-markers
    --tb=short

# Ignore patterns
norecursedirs = .git .tox build dist *.egg .agents research

# Timeout for tests (in seconds)
# timeout = 300
