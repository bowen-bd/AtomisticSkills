repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # uv.lock files are generated text and must be committed whole.
        # The 542 KiB compressed Wannier overlap fixture supports offline tests;
        # its pinned upstream source and hashes are recorded in provenance.json.
        exclude: '(^|/)uv\.lock$|^skills/mat-wannier-tight-binding/examples/silicon-sp3/silicon\.mmn\.xz$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.3.5
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
